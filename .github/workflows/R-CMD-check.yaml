# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:

name: R-CMD-check.yaml

permissions: read-all

# Auto-cancel superseded in-progress runs for the same ref so stale runs don't
# pile up and starve the runner pool.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          # ubuntu-release carries the vignette signal: it is the only row that
          # RUNS the vignette fits.  Every other row sets NLMIXR2NN_VIGNETTE_FITS
          # to false and still does a complete build + check -- install,
          # examples, Rd and compiled-code checks all run, which is what those
          # rows are here to catch.  They cannot afford the fits: the user
          # vignette has six chunks that fit real FOCEi/bobyqa models, and
          # `R CMD check` runs them TWICE (once in `R CMD build`, then again
          # re-building vignette outputs).  That is the workload that gets a
          # hosted runner reclaimed mid-job ("exit code 143").
          #
          # BACKENDS.  ubuntu-release builds against libtorch; every other row
          # builds the self-contained Adam/SGD fallback.  Both paths are real
          # and both are gates.  Windows in particular builds the fallback by
          # default (configure.win explains why the MSVC-built libtorch cannot
          # be linked by MinGW), which is what makes a working Windows binary --
          # and so a CRAN submission -- possible.
          # macOS resolves binaries from CRAN, and CRAN's R-4.6 arm64 repo
          # (bin/macosx/sonoma-arm64/contrib/4.6) now serves ZSTD-compressed
          # .tgz files, which pak 0.11.1 cannot unpack: "Cannot extract
          # knitr_1.52.tgz, unknown archive type", failing before this package
          # is even built.  Verified by hand: that CRAN file is Zstandard, while
          # the same package from P3M is gzip.  `use-public-rspm` only redirects
          # Linux, so P3M is added explicitly here.  Drop this once CRAN's
          # macOS binaries are readable by the pak the runners install.
          - {os: macos-latest,   r: 'release', vignetteFits: 'false',
             extraRepos: 'https://packagemanager.posit.co/cran/latest'}
          - {os: windows-latest, r: 'release', vignetteFits: 'false'}
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release', vignetteFits: 'false'}
          - {os: ubuntu-latest,  r: 'oldrel-1', vignetteFits: 'false'}
          - {os: ubuntu-latest,  r: 'release', backend: 'torch'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # Covers any path that loads torch before the explicit install step -- and
      # stays off for the builtin rows, which must not fetch libtorch at all.
      TORCH_INSTALL: ${{ matrix.config.backend == 'torch' && '1' || '0' }}
      # Only ubuntu-release runs the vignette fits; see the matrix comment.
      NLMIXR2NN_VIGNETTE_FITS: ${{ matrix.config.vignetteFits || 'true' }}
      # Pin the backend rather than letting configure auto-detect, so a row that
      # is supposed to test libtorch FAILS when libtorch is missing instead of
      # quietly falling back and reporting green for the wrong thing.
      NLMIXR2NN_BACKEND: ${{ matrix.config.backend || 'builtin' }}
      # NB: TORCH_HOME is deliberately NOT set.  Pointing it at a scratch
      # directory to keep the ~2GB libtorch out of the cached R library looks
      # tidy and does not work: torch's inst_path() REFUSES any TORCH_HOME that
      # is not one of the R library paths ("torch cannot write into configured
      # TORCH_HOME", measured on every runner).  libtorch therefore lives in
      # torch's own package directory, inside the dependency cache.  That is
      # affordable because only the one `backend: torch` row installs it -- the
      # rest build the builtin optimizer and never download anything.

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true
          # Empty for every row but macOS -- see the matrix comment.
          extra-repositories: ${{ matrix.config.extraRepos || '' }}

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: 1
          # Mirrors nlmixr2est's list, plus nlmixr2est itself: nlmixr2nn needs
          # the ui-assembly hooks and the forced-covariate change that are
          # merged upstream but not yet released.
          extra-packages: |
            any::rcmdcheck
            nlmixr2/lbfgsb3c
            nlmixr2/dparser-R
            nlmixr2/n1qn1c
            nlmixr2/lotri
            nlmixr2/rxode2ll
            nlmixr2/rxode2lincmt
            nlmixr2/rxode2
            nlmixr2/PreciseSums
            nlmixr2/RcppTrust
            nlmixr2/nlmixr2est
            qs=?ignore
            rstan=?ignore
          needs: check

      - name: Install libtorch
        if: matrix.config.backend == 'torch'
        # nlmixr2nn LINKS libtorch, and ./configure looks for it, so the
        # binaries must exist before R CMD build/INSTALL runs -- not merely
        # before the tests.  Without this the build fails in configure with
        # "libtorch itself does not appear to be installed".  install_torch() is
        # a no-op when the cache above already restored it.  stopifnot() fails
        # HERE rather than leaving a confusing configure abort later.
        run: |
          torch::install_torch()
          stopifnot(torch::torch_is_installed())
        shell: Rscript {0}

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
